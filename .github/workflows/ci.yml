# The same gate as `make validate`, then the contact sheets — attached to every run as the
# `snapshots` artifact, so each push can be LOOKED at, not just passed.
# Needs Xcode 26+ (Swift 6.2+ for `defaultIsolation` in Package.swift), hence macos-26.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR: a newer push cancels the older, still-running macOS job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: make doctor
      - name: Gate — lint + build + test
        run: make validate
      - name: Contact sheets
        run: make snap
      - name: Upload contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: Snapshots
